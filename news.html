<!-- Inside the console every child page runs in an iframe, and the shell has
     already loaded AdSense. Pausing here keeps a second copy from stacking a
     second anchor on the first; the loader tag itself stays static below so
     the verification crawler still finds it in the source. -->
<script>
  if (window.parent !== window) {
    (window.adsbygoogle = window.adsbygoogle || []).pauseAdRequests = 1;
  }
</script>
<!-- Google AdSense. Static in <head> on every page so the verification
     crawler finds it in the source, not only after JavaScript runs. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7720076982812531"
        crossorigin="anonymous"></script>

<!doctype html>
<meta charset="utf-8">
<title>Moved</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://worldearthquakelabs.com/">
<script>
  /* Project Pages live under /wel/, so drop that prefix and hand the rest of
     the path to the real site: /wel/map -> worldearthquakelabs.com/map. */
  (function () {
    var rest = location.pathname.replace(/^\/wel(?=\/|$)/, "");
    location.replace("https://worldearthquakelabs.com" + (rest || "/") + location.search + location.hash);
  })();
</script>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         color:#334155; background:#f8fafc; }
  a { color:#2563eb; }
</style>
<p>This address has moved to <a href="https://worldearthquakelabs.com/">worldearthquakelabs.com</a>.</p>
